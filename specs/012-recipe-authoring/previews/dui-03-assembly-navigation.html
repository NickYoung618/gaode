</style></head><body><div class="review-strip"><strong>DUI-03 · 半成品检测部位导航方案，待用户确认</strong><span>只预览第二步的导航表达；格位、成员名称及面为示意身份，输入空白，不是配置默认值或保存证据。</span></div><div class="backdrop"><section class="modal"><div class="titlebar"><h1>配方制作</h1><span class="pill gray">半成品检测部位 · 导航预览</span></div><div class="tabs"><button class="tab" disabled>1　基础信息</button><button class="tab active">2　坐标配置</button><button class="tab" disabled>3　检查保存</button></div><div class="content"><div class="editor"><aside class="panel nav"><h3>坐标配置</h3><button class="active" data-purpose="photo">拍照位置</button><button data-purpose="flip">翻面取放</button><button data-purpose="scan">E扫码位置</button><button data-purpose="sort">NG / Pending分拣</button></aside><section class="panel tray-panel"><div class="tray-heading"><h3>料盘总览</h3><span class="note">10 × 10</span></div><div class="tray-counts"><span><i class="area-dot ng-dot"></i>NG：2</span><span><i class="area-dot ok-dot"></i>OK：3</span><span><i class="area-dot pending-dot"></i>Pending：2</span></div><div class="tray-body"><div class="tray-direction">料盘实际位置 · 空位保留</div><div class="tray-scroll"><div class="tray-grid" id="matrix"></div></div></div><div class="tray-legend"><span><i class="editing-dot"></i>当前填写位置</span><span>填写状态仅代表配置填写</span></div><div class="tray-current" id="location"></div></section><section class="panel detail"><div class="detail-heading"><h2 id="heading"></h2><span class="pill gray">待填写</span></div><div class="location-tag" id="locationTag"></div><div id="navigation"><h3>检测部位</h3><div class="choice-rail"><button class="active" data-object="0">检测部位甲<small>待填写</small></button><button data-object="1">检测部位乙<small>待填写</small></button></div><div class="face-rail"><button class="active" data-face="0">面 1</button><button data-face="1">面 2</button></div></div><div id="cards" class="point-grid"></div></section></div></div><div class="notice">仅审查导航位置、切换与整体／成员取放边界；没有正式API、持久保存或设备操作。</div><div class="footer"><button disabled>上一步</button><button class="primary" disabled>检查保存</button></div></section></div><script>
const kind='assembly', word='检测部位';const layout=[{row:2,col:1,region:'NG'},{row:3,col:1,region:'NG'},{row:2,col:4,region:'OK'},{row:2,col:6,region:'OK'},{row:4,col:5,region:'OK'},{row:2,col:9,region:'Pending'},{row:4,col:9,region:'Pending'}];for(const region of ['NG','OK','Pending'])layout.filter(c=>c.region===region).sort((a,b)=>a.row-b.row||a.col-b.col).forEach((c,i)=>c.number=i+1);let cell=layout.find(c=>c.row===2&&c.col===6),object=0,face=0,purpose='photo';const values=new Map();function context(){return `${cell.row}:${cell.col}:${cell.region}:${object}:${face}:${purpose}`}function fields(labels,key){return labels.map(label=>`<label class="field">${label}<input autocomplete="off" placeholder="未填写" data-key="${key}:${label}"></label>`).join('')}function card(name,key,photo=false,axes=['X','Y','Z']){return `<div class="point-card"><h3>${name}</h3><div class="axes">${fields(axes,key)}</div>${photo?`<div class="capture-fields">${fields(['曝光（µs）','增益','光源亮度（%）'],key)}</div>`:''}</div>`}function render(){const matrix=document.querySelector('#matrix');matrix.replaceChildren();for(let row=1;row<=10;row++)for(let col=1;col<=10;col++){let c=layout.find(x=>x.row===row&&x.col===col);let b=document.createElement(c?'button':'div');if(!c){b.className='tray-void';b.setAttribute('aria-label',`第${row}行第${col}列，未选择`)}else{b.className=`tray-cell area-${c.region.toLowerCase()} ${c===cell?'selected':''}`;b.innerHTML=`<span class="slot-number">${c.number}</span><span class="slot-area">${c.region}</span>`;b.setAttribute('aria-label',`${c.region}${c.number}，第${row}行第${col}列`);b.onclick=()=>{cell=c;object=0;face=0;render()}}matrix.append(b)}const loc=`${cell.region}${cell.number} · 第${cell.row}行，第${cell.col}列`;document.querySelector('#heading').textContent=loc;document.querySelector('#location').textContent='当前填写：'+loc;document.querySelector('#locationTag').textContent=loc;const isOK=cell.region==='OK',mechanical=kind==='assembly'&&['flip','sort'].includes(purpose);document.querySelector('#navigation').hidden=!isOK||mechanical;document.querySelectorAll('[data-object]').forEach(b=>b.classList.toggle('active',Number(b.dataset.object)===object));document.querySelectorAll('[data-face]').forEach(b=>b.classList.toggle('active',Number(b.dataset.face)===face));document.querySelector('.face-rail').hidden=purpose!=='photo';const name=word+(object===0?'甲':'乙'),key=mechanical?`${cell.row}:${cell.col}:whole:${purpose}`:context();let content;if(!isOK){content=card(cell.region+'分拣放料位置',`${cell.row}:${cell.col}:${cell.region}`)}else if(purpose==='photo'){content=card(`${name} · 面${face+1} · 相机A`,key+':A',true)+card(`${name} · 面${face+1} · 相机B`,key+':B',true)}else if(purpose==='scan'){content=card(name+' · 相机E扫码位置',key+':E',true)}else if(purpose==='flip'){let n=kind==='assembly'?'整体':name;content=card(n+'翻面取料',key+':pick',false,['X','Y'])+card(n+'翻面放回',key+':put',false,['X','Y'])}else{content='<p class="note">在对应NG或Pending格填写分拣位置。普通OK留原槽，不增加分拣搬运。</p>'}document.querySelector('#cards').innerHTML=content;document.querySelectorAll('[data-key]').forEach(i=>{i.value=values.get(i.dataset.key)||'';i.oninput=()=>values.set(i.dataset.key,i.value)})}document.querySelectorAll('[data-object]').forEach(b=>b.onclick=()=>{object=Number(b.dataset.object);render()});document.querySelectorAll('[data-face]').forEach(b=>b.onclick=()=>{face=Number(b.dataset.face);render()});document.querySelectorAll('[data-purpose]').forEach(b=>b.onclick=()=>{purpose=b.dataset.purpose;document.querySelectorAll('[data-purpose]').forEach(x=>x.classList.toggle('active',x===b));render()});render();
</script></body></html>
