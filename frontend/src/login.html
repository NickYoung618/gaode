<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>制冷机零件缺陷检测系统 · 登录</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=Orbitron:wght@500;700;800&display=swap" rel="stylesheet" />
<script src="https://unpkg.com/lucide@latest"></script>
<style>
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; font-family:'Noto Sans SC', system-ui, sans-serif; }
  body {
    min-height: 100vh;
    color: #dbeafe;
    background:
      radial-gradient(900px 500px at 80% 45%, rgba(59,130,246,.35), transparent 65%),
      radial-gradient(700px 400px at 90% 55%, rgba(14,165,233,.28), transparent 60%),
      linear-gradient(135deg, #021033 0%, #032552 50%, #01132e 100%);
    overflow: hidden;
    position: relative;
  }

  /* starfield particles */
  .stars {
    position: absolute; inset: 0; z-index: 0; pointer-events: none;
    background-image:
      radial-gradient(1px 1px at 10% 20%, rgba(255,255,255,.9), transparent 50%),
      radial-gradient(1px 1px at 32% 70%, rgba(255,255,255,.7), transparent 50%),
      radial-gradient(1px 1px at 55% 35%, rgba(255,255,255,.85), transparent 50%),
      radial-gradient(1px 1px at 72% 80%, rgba(255,255,255,.55), transparent 50%),
      radial-gradient(1.5px 1.5px at 88% 22%, rgba(255,255,255,.9), transparent 50%),
      radial-gradient(1px 1px at 15% 78%, rgba(255,255,255,.6), transparent 50%),
      radial-gradient(1px 1px at 42% 12%, rgba(255,255,255,.7), transparent 50%),
      radial-gradient(1px 1px at 65% 62%, rgba(255,255,255,.8), transparent 50%),
      radial-gradient(1.5px 1.5px at 95% 88%, rgba(255,255,255,.75), transparent 50%),
      radial-gradient(1px 1px at 5% 50%, rgba(255,255,255,.5), transparent 50%);
    background-size: 100% 100%;
  }

  /* hexagon decoration */
  .hex-deco { position:absolute; inset:0; z-index:0; pointer-events:none; opacity:.25; }
  .hex {
    position: absolute;
    width: 120px; height: 138px;
    background: transparent;
    clip-path: polygon(25% 5%, 75% 5%, 100% 50%, 75% 95%, 25% 95%, 0% 50%);
    border: 1px solid rgba(96,165,250,.4);
  }
  .hex::before {
    content:''; position: absolute; inset:2px;
    clip-path: polygon(25% 5%, 75% 5%, 100% 50%, 75% 95%, 25% 95%, 0% 50%);
    background: rgba(59,130,246,.04);
  }

  /* title bar */
  .title-bar {
    position: relative; z-index: 2;
    height: 38px;
    background: rgba(3, 14, 36, 0.9);
    border-bottom: 1px solid rgba(59,130,246,.25);
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 14px;
  }
  .title-bar .btn-close {
    width: 28px; height: 22px; display: flex; align-items: center; justify-content: center;
    color: #93c5fd; cursor: pointer; border-radius: 3px;
  }
  .title-bar .btn-close:hover { background: rgba(239,68,68,.7); color:#fff; }

  /* main title */
  .big-title {
    font-family: 'Orbitron','Noto Sans SC', sans-serif;
    font-weight: 700;
    letter-spacing: 6px;
    font-size: 52px;
    color: #e0f2fe;
    text-shadow:
      0 0 12px rgba(96,165,250,.55),
      0 0 32px rgba(59,130,246,.35),
      0 0 64px rgba(14,165,233,.25);
  }

  /* form */
  .field-label {
    color: #bfdbfe; font-size: 16px; width: 60px; text-align: right; margin-right: 14px;
  }
  .field {
    width: 280px; height: 38px;
    background: rgba(8, 26, 58, 0.85);
    border: 1px solid rgba(96,165,250,.35);
    border-radius: 2px;
    padding: 0 12px;
    color: #e0f2fe;
    font-size: 14px;
    outline: none;
    transition: border-color .2s, box-shadow .2s;
  }
  .field:focus { border-color: #38bdf8; box-shadow: 0 0 0 2px rgba(56,189,248,.18); }

  .btn-enter {
    width: 180px; height: 40px;
    border-radius: 999px;
    background: linear-gradient(135deg, #1d4ed8 0%, #2563eb 50%, #0ea5e9 100%);
    color: #f0f9ff;
    font-size: 16px;
    letter-spacing: 2px;
    border: 1px solid rgba(147,197,253,.45);
    box-shadow: 0 6px 18px -4px rgba(14,165,233,.6), inset 0 1px 0 rgba(255,255,255,.25);
    cursor: pointer;
    transition: transform .15s, filter .15s;
  }
  .btn-enter:hover { filter: brightness(1.08); transform: translateY(-1px); }
  .btn-enter:active { transform: translateY(0); filter: brightness(.95); }

  .role-chip {
    padding: 3px 12px;
    border-radius: 14px;
    font-size: 12px;
    border: 1px solid rgba(96,165,250,.35);
    background: rgba(8, 26, 58, 0.6);
    color: #93c5fd;
    cursor: pointer;
    transition: all .15s;
  }
  .role-chip.active {
    background: rgba(14,165,233,.25);
    border-color: #38bdf8;
    color: #e0f2fe;
    box-shadow: 0 0 10px rgba(56,189,248,.35);
  }
  .role-chip:hover { color: #e0f2fe; }
</style>
</head>
<body>

  <!-- title bar -->
  <div class="title-bar">
    <div class="flex items-center gap-2 text-[13px] text-blue-200">
      <i data-lucide="scan-search" class="w-4 h-4 text-cyan-300"></i>
      <span>制冷机零件缺陷检测系统 · V1.0</span>
    </div>
    <div class="btn-close" onclick="window.close()" title="关闭"><i data-lucide="x" class="w-4 h-4"></i></div>
  </div>

  <!-- decorative layers -->
  <div class="stars"></div>
  <div class="hex-deco">
    <div class="hex" style="top: 15%; right: 8%;"></div>
    <div class="hex" style="top: 32%; right: 22%;"></div>
    <div class="hex" style="top: 52%; right: 4%; transform: scale(1.3);"></div>
    <div class="hex" style="top: 62%; right: 18%; transform: scale(.85);"></div>
    <div class="hex" style="top: 78%; right: 10%;"></div>
    <div class="hex" style="top: 22%; right: 30%; transform: scale(.7);"></div>
  </div>

  <!-- central content -->
  <div class="relative z-10 flex flex-col items-center justify-center" style="min-height: calc(100vh - 38px); padding-top: 20px;">

    <div class="big-title mb-14">制冷机零件缺陷检测系统</div>

    <form id="loginForm" class="flex flex-col items-center gap-5" onsubmit="handleLogin(event)">
      <div class="flex items-center">
        <label class="field-label">用户</label>
        <input class="field" type="text" id="user" value="张工" autocomplete="off" />
      </div>

      <div class="flex items-center">
        <label class="field-label">密码</label>
        <input class="field" type="password" id="pwd" value="••••••" />
      </div>

      <div class="flex items-center">
        <label class="field-label">权限</label>
        <div class="flex gap-2" style="width:280px;">
          <div class="role-chip" data-role="L1">L1 · 操作员</div>
          <div class="role-chip" data-role="L2">L2 · 工程师</div>
          <div class="role-chip active" data-role="L3">L3 · 管理员</div>
        </div>
      </div>

      <button class="btn-enter mt-6" type="submit">进 入 系 统</button>
    </form>

  </div>

<script>
  // role selector
  document.querySelectorAll('.role-chip').forEach(c => {
    c.addEventListener('click', () => {
      document.querySelectorAll('.role-chip').forEach(x => x.classList.remove('active'));
      c.classList.add('active');
    });
  });

  function handleLogin(e){
    e.preventDefault();
    const role = document.querySelector('.role-chip.active').dataset.role;
    const user = document.getElementById('user').value.trim() || '张工';
    // pass through query params so prototype can pick them up if需要
    const qs = new URLSearchParams({ user, role });
    window.location.href = 'prototype.html?' + qs.toString();
  }

  lucide.createIcons();
</script>
</body>
</html>
